# SO-101 follower RMPFlow configuration.
#
# Conservative gains are used because the SO-101 is a small 5-DOF arm and the
# gripper is controlled separately.  This is a controller validation scaffold;
# tune the gains only after the 1-cube smoke succeeds.

api_version: 1.0

joint_limit_buffers: [0.02, 0.02, 0.02, 0.02, 0.02]

rmp_params:
  cspace_target_rmp:
    metric_scalar: 35.0
    position_gain: 60.0
    damping_gain: 35.0
    robust_position_term_thresh: 0.5
    inertia: 1.0
  cspace_trajectory_rmp:
    p_gain: 60.0
    d_gain: 8.0
    ff_gain: 0.2
    weight: 40.0
  cspace_affine_rmp:
    final_handover_time_std_dev: 0.25
    weight: 1000.0
  joint_limit_rmp:
    metric_scalar: 800.0
    metric_length_scale: 0.01
    metric_exploder_eps: 0.001
    metric_velocity_gate_length_scale: 0.01
    accel_damper_gain: 120.0
    accel_potential_gain: 1.0
    accel_potential_exploder_length_scale: 0.1
    accel_potential_exploder_eps: 0.01
  joint_velocity_cap_rmp:
    max_velocity: 1.0
    velocity_damping_region: 0.3
    damping_gain: 120.0
    metric_weight: 80.0
  target_rmp:
    accel_p_gain: 45.0
    accel_d_gain: 70.0
    accel_norm_eps: 0.075
    metric_alpha_length_scale: 0.05
    min_metric_alpha: 0.01
    max_metric_scalar: 6000.0
    min_metric_scalar: 1000.0
    proximity_metric_boost_scalar: 8.0
    proximity_metric_boost_length_scale: 0.02
    accept_user_weights: false
  axis_target_rmp:
    accel_p_gain: 80.0
    accel_d_gain: 25.0
    metric_scalar: 3.0
    proximity_metric_boost_scalar: 500.0
    proximity_metric_boost_length_scale: 0.05
    accept_user_weights: false
  collision_rmp:
    damping_gain: 30.0
    damping_std_dev: 0.04
    damping_robustness_eps: 0.01
    damping_velocity_gate_length_scale: 0.01
    repulsion_gain: 400.0
    repulsion_std_dev: 0.01
    metric_modulation_radius: 0.25
    metric_scalar: 3000.0
    metric_exploder_std_dev: 0.02
    metric_exploder_eps: 0.001
  damping_rmp:
    accel_d_gain: 20.0
    metric_scalar: 40.0
    inertia: 50.0

canonical_resolve:
  max_acceleration_norm: 30.0
  projection_tolerance: 0.01
  verbose: false

body_cylinders:
  - name: base_link
    pt1: [0.0, 0.0, 0.08]
    pt2: [0.0, 0.0, 0.0]
    radius: 0.08

body_collision_controllers:
  - name: wrist_link
    radius: 0.035
  - name: gripper_link
    radius: 0.035
