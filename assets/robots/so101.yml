  extra_links:
    # attached_object 는 tcp_grasp 와 동일 transform 필수: AttachmentManager.update() 가
    # sphere offset 을 tool_frames[0](=tcp_grasp) 프레임으로 계산해 이 링크 슬롯에 기록하고
    # FK 는 이 링크 프레임으로 배치 → 불일치 시 blob 이 (0,-0.015,-0.025)+Ry(π) 만큼 오배치됨.
    attached_object:
      fixed_transform:
      - 0.012
      - -0.015
      - -0.025
      - 0.024337
      - 0.0
      - 0.999704
      - 0.0
      joint_name: attach_joint
      joint_type: FIXED
      link_name: attached_object
      parent_link_name: gripper_link
    # grasp TCP: 손가락 사이 pinch 지점 — collision sphere 기하 유도(fixed pad x≈-0.018·
    # jaw pad x≈+0.018 대칭, y≈0, pad 유효 z -0.05~-0.09 중심 -0.070; tip -0.092 는
    # pinch 너머 2.2cm → top-down cube z0.06 에서 tip z≈0.038>책상 0.035 클리어).
    # +z = approach(손끝 방향), x = closing 축. quat = Ry(pi - 0.0486795):
    # USD 체인에 URDF wrist_roll origin 의 Ry(0.0487) 항이 없어(이중 FK Δrot=2.79°) 모델
    # tool 이 sim 실제 대비 2.79° 피치 — TCP 회전으로 흡수(전 자세 상수라 정확 보정).
    tcp_grasp:
      fixed_transform:
      - 0.012
      - -0.015
      - -0.025
      - 0.024337
      - 0.0
      - 0.999704
      - 0.0
      joint_name: tcp_grasp_joint
      joint_type: FIXED
      link_name: tcp_grasp
      parent_link_name: gripper_link
  format_version: 2.0
  grasp_contact_link_names:
