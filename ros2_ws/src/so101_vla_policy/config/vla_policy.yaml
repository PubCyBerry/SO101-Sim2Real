# so101_vla_policy 노드 파라미터.
# 비워 두면(""/0) .env + env/<POLICY_PROFILE>.env 값을 쓰고, 채우면 그 값으로 override 한다.
/**:
  ros__parameters:
    use_sim_time: true
    # .env 위치 (컨테이너 마운트 기준). repo 가 /workspace 에 마운트됨.
    env_file: /workspace/.env
    env_dir: /workspace/env
    # policy-server / 정책 (빈 값이면 env 사용)
    server_address: ""
    policy_type: ""
    pretrained_name_or_path: ""
    actions_per_chunk: 0
    task_instruction: ""
    rename_map: ""
    policy_device: ""
    chunk_size_threshold: 0.0
    poll_timeout: 5.0
    fps: 30
    # 토픽 (sim 기본; 실기기는 joint_states_topic=/follower/joint_states 등으로 override)
    joint_states_topic: /isaac_joint_states
    joint_commands_topic: /isaac_joint_commands
