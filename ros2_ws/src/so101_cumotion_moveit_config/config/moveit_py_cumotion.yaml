# MoveItPy 설정 (PATH E) — pick_place_sm 의 MoveItPy 노드(node_name="pick_place_moveit")가 읽는다.
# so101_moveit_config/config/moveit_py_config.yaml 의 cuMotion 변형. named set 으로
# cumotion(기본) / ompl_rrtc(fallback) 을 둔다.
planning_scene_monitor_options:
  name: "planning_scene_monitor"
  robot_description: "robot_description"
  joint_state_topic: "/follower/joint_states"
  attached_collision_object_topic: "/moveit_cpp/planning_scene_monitor"
  publish_planning_scene_topic: "/moveit_cpp/publish_planning_scene"
  monitored_planning_scene_topic: "/moveit_cpp/monitored_planning_scene"
  wait_for_initial_state_timeout: 30.0

planning_pipelines:
  pipeline_names: ["isaac_ros_cumotion", "ompl"]

plan_request_params:
  planning_attempts: 1
  planning_pipeline: isaac_ros_cumotion
  max_velocity_scaling_factor: 1.0
  max_acceleration_scaling_factor: 1.0
  planning_time: 3.0

# ── named parameter sets (SM 이 MultiPipelinePlanRequestParameters 로 선택) ──
cumotion:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: isaac_ros_cumotion
    max_velocity_scaling_factor: 1.0
    max_acceleration_scaling_factor: 1.0
    planning_time: 3.0

ompl_rrtc:
  plan_request_params:
    planning_attempts: 2
    planning_pipeline: ompl
    planner_id: "RRTConnect"
    max_velocity_scaling_factor: 1.0
    max_acceleration_scaling_factor: 1.0
    planning_time: 2.0
