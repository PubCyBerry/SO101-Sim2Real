# cuMotion MoveIt planning pipeline (PATH E).
# MoveItConfigsBuilder.planning_pipelines(pipelines=["isaac_ros_cumotion", ...]) 가
# package_name(so101_moveit_config) 의 config/ 에서 이 파일(<pipeline>_planning.yaml)을 찾는다.
# 실제 계획은 cuMotion action server(isaac_ros_cumotion)가 XRDF/URDF 로 수행하고,
# 이 plugin 이 move_group ↔ action server 를 잇는다.
planning_plugins:
  - isaac_ros_cumotion_moveit/CumotionPlanner

# request_adapters 는 비워야 하지만, 빈 리스트([])는 launch_ros 가 빈 튜플로 변환해
# Node 파라미터 타입 검증에서 실패한다(Expected float/int/str/bool/bytes, got tuple).
# 키를 생략하면 MoveIt 이 "request adapter 없음"으로 처리한다.
response_adapters:
  - default_planning_response_adapters/ValidateSolution
  - default_planning_response_adapters/DisplayMotionPath
