manipulator:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.3
  kinematics_solver_attempts: 10
  # 5-DOF SO-101: position-priority IK. full 6-DOF pose(위치+방향)는 thin manifold 라
  # orientation 까지 맞추면 대부분 XY 에서 IK 실패(-31). orientation_threshold 를 크게(≈π) 줘서
  # "방향은 아무거나, 위치만 맞으면 성공" 으로 만든다. rotation_scale 은 낮게 둬 down-ish 를 약하게 선호.
  position_scale: 1.0
  rotation_scale: 0.02
  position_threshold: 0.01               # 위치 1cm 이내면 성공
  orientation_threshold: 3.15            # ≈π: 방향 오차 무시(임의 orientation 허용)
  cost_threshold: 0.05
  approximate: false                     # ★ approximate:true 는 도달 불가 타겟에도 근사해(위치 수십 cm 오차)를
                                         #   success 로 반환해 무용. false 로 두면 위치 1cm 이내 해가 있을 때만 성공.
  approximate_solution_position_threshold: 0.02
  approximate_solution_orientation_threshold: 3.15
  mode: global                # global search (like DLS with random restarts)