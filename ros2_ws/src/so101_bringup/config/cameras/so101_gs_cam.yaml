/**:
  ros__parameters:
    camera_info_url: ""
    use_sensor_data_qos: false
    sync_sink: false
    use_gst_timestamps: true
    image_encoding:  "rgb8" 


/follower/cam_wrist:
  ros__parameters:
    frame_id: "follower/wrist_camera_optical_frame"
    camera_name: "cam_wrist"
    # gscam_config: "v4l2src device=/dev/cam_wrist ! video/x-raw,format=YUY2,width=640,height=480,framerate=30/1 ! queue max-size-buffers=1 leaky=downstream ! videoconvert"
    # gscam_config: "v4l2src device=/dev/cam_wrist ! image/jpeg,width=640,height=480,framerate=25/1 ! queue max-size-buffers=1 leaky=downstream ! jpegdec ! queue max-size-buffers=1 leaky=downstream ! videoconvert ! video/x-raw,format=RGB"
    gscam_config: >
      v4l2src device=/dev/cam_wrist ! 
      image/jpeg,width=640,height=480,framerate=25/1 ! 
      jpegdec ! videoconvert ! video/x-raw,format=RGB

/static_camera/cam_overhead:
  ros__parameters:
    frame_id: "follower/static_camera_optical_frame"
    camera_name: "cam_overhead"
    # gscam_config: "v4l2src device=/dev/cam_overhead ! video/x-raw,format=YUY2,width=640,height=480,framerate=30/1 ! queue max-size-buffers=1 leaky=downstream ! videoconvert"
    # gscam_config: "v4l2src device=/dev/cam_overhead ! image/jpeg,width=640,height=480,framerate=25/1 ! queue max-size-buffers=1 leaky=downstream ! jpegdec ! queue max-size-buffers=1 leaky=downstream ! videoconvert ! video/x-raw,format=RGB"
    gscam_config: >
      v4l2src device=/dev/cam_overhead !
      image/jpeg,width=640,height=480,framerate=25/1 !
      jpegdec ! videoconvert ! video/x-raw,format=RGB
/front_camera/cam_front:
  ros__parameters:
    frame_id: "follower/front_camera_optical_frame"
    camera_name: "cam_front"
    gscam_config: >
      v4l2src device=/dev/cam_front !
      image/jpeg,width=640,height=480,framerate=25/1 !
      jpegdec ! videoconvert ! video/x-raw,format=RGB
