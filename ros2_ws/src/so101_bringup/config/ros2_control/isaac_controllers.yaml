# Isaac Sim 브릿지용 ros2_control 컨트롤러 (hardware_type:=isaac).
# follower_split_controllers.yaml 과 동일 구조이나:
#   - update_rate 100Hz (USB-IP 없음 → 실기기 50Hz 제약 불필요)
#   - 하드웨어가 topic_based (Isaac 이 /isaac_joint_states 발행, /isaac_joint_commands 구독)
# namespace 는 follower 유지 → joint_state_broadcaster 가 /follower/joint_states 발행
# (move_group 이 joint_states→/follower/joint_states remap 으로 구독).
follower:
  controller_manager:
    ros__parameters:
      update_rate: 100
      use_sim_time: true

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      arm_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      gripper_controller:
        type: parallel_gripper_action_controller/GripperActionController

  joint_state_broadcaster:
    ros__parameters:
      use_sim_time: true
      publish_rate: 100.0

  arm_trajectory_controller:
    ros__parameters:
      use_sim_time: true
      joints:
        - shoulder_pan
        - shoulder_lift
        - elbow_flex
        - wrist_flex
        - wrist_roll
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      open_loop_control: false
      constraints:
        stopped_velocity_tolerance: 0.01
        # Isaac 추종 지연 대비: goal_time 여유 (0=무제한, 추종 안정 후 조이기)
        goal_time: 0.0

  gripper_controller:
    ros__parameters:
      use_sim_time: true
      joint: gripper
      allow_stalling: true
