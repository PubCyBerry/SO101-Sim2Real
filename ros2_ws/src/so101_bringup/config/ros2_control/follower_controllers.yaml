follower:
  controller_manager:
    ros__parameters:
      # USB-IP(usbipd-win) + WSL2 mirrored 환경: serial read 가 14~26ms 스파이크라
      # 100Hz(10ms 예산)면 overrun 누적 후 read timeout 으로 hardware deactivate 된다.
      # 50Hz(20ms 예산)로 낮춰 안정화. 네이티브 Linux 면 100 복원 가능.
      update_rate: 50

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      forward_controller:
        type: forward_command_controller/ForwardCommandController

      trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  trajectory_controller:
    ros__parameters:
      joints:
        - shoulder_pan
        - shoulder_lift
        - elbow_flex
        - wrist_flex
        - wrist_roll
        - gripper
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

      state_publish_rate: 50.0
      action_monitor_rate: 20.0

      allow_partial_joints_goal: false
      open_loop_control: false

      constraints:
        stopped_velocity_tolerance: 0.01

  forward_controller:
    ros__parameters:
      joints:
        - shoulder_pan
        - shoulder_lift
        - elbow_flex
        - wrist_flex
        - wrist_roll
        - gripper
      interface_name: position
