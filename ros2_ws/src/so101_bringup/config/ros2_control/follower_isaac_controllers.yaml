# PATH E — Isaac Sim(topic_based_ros2_control) 용 컨트롤러 구성.
# follower_split_controllers.yaml 과 컨트롤러 구성은 같고, 네이티브 Linux + topic
# bridge 라 update_rate 를 100Hz 로 복원한다(WSL2/USB-IP 의 50Hz 제약 없음).
# 하드웨어는 so101_ros2_control.xacro 의 hardware_type:=isaac (TopicBasedSystem).
follower:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      arm_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      gripper_controller:
        type: parallel_gripper_action_controller/GripperActionController

  joint_state_broadcaster:
    ros__parameters:
      publish_rate: 100.0

  arm_trajectory_controller:
    ros__parameters:
      joints:
        - shoulder_pan
        - shoulder_lift
        - elbow_flex
        - wrist_flex
        - wrist_roll
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      open_loop_control: false
      constraints:
        stopped_velocity_tolerance: 0.01
        goal_time: 2.0

  gripper_controller:
    ros__parameters:
      joint: gripper
      allow_stalling: true
      # cuMotion 은 그리퍼를 계획하지 않는다(group "gripper" 단독). open=1.5, closed=-0.16(SRDF).
      max_velocity: 1.0
