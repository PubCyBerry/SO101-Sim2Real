# WSL2 + ROS 2 CycloneDDS 대용량 샘플(카메라 이미지) 전송용 커널 튜닝.
#
# 배경: WSL2 loopback 의 소켓 수신 버퍼 기본 한계(net.core.rmem_max=208KB)가
# 작아, CycloneDDS 가 640x480 bgr8 이미지(921KB)를 단편화해 보내도 수신측
# 재조립 버퍼가 넘쳐 드롭된다 → 이미지 토픽이 0 fps 로 전달.
# cyclonedds_localhost.xml 의 SocketReceiveBufferSize min=10MB 요청이
# 커널 한계에 막히지 않도록 rmem_max 를 올린다.
#
# 적용 (WSL2 Ubuntu, 1회):
#   sudo cp ros2_ws/setup/wsl_ros2_sysctl.conf /etc/sysctl.d/99-ros2-wsl.conf
#   sudo sysctl --system
# WSL 재시작 후에도 /etc/sysctl.d/ 의 설정은 자동 적용된다.

net.core.rmem_max = 16777216
net.core.rmem_default = 16777216
