# =============================================================================
# pyproject.toml — robotics-manipulation
#
# ■ 의존성 그룹 전략
# ─────────────────────────────────────────────────────────────────────────────
#   [project].dependencies  : 모든 환경에서 공통으로 필요한 최소 패키지
#   [dependency-groups]
#     teleop  : SO-101 실물 Arm Teleoperation (LeRobot + Feetech 서보)
#     policy  : VLA policy 학습/추론 보조 (lerobot[smolvla] + GR00T deps) — 호스트 참조용
#     async   : Async inference policy server gRPC 스택 (grpcio + protobuf)
#     isaac   : Isaac Sim / IsaacLab 시뮬레이션 환경
#     dev     : 개발 도구 (Jupyter 등)
#
# ■ 설치 예시
#   전체       : uv sync --all-groups
#   teleop만   : uv sync --only-group teleop
#   isaac만    : uv sync --only-group isaac
#   공용+teleop: uv sync --group teleop
#   공용+dev   : uv sync --group dev
#
# ■ Docker 사용
#   docker/Dockerfile.lerobot (lerobot 이미지): uv sync --group teleop --group async
#   docker/Dockerfile.policy  (policy-server 이미지): pyproject.toml 과 독립.
#     lerobot 0.5.1 (numpy>=2.0) 이 아래 override (numpy==1.26.0 등, Isaac 호환핀) 과
#     충돌하므로 uv sync 대신 `uv pip install "lerobot[smolvla,async]==0.5.1"` 로 직접
#     명세한다. 따라서 policy / async 그룹의 lerobot 버전은 Docker 빌드에 영향 없음.
# =============================================================================

[build-system]
requires      = ["setuptools<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name        = "sim_to_real"
version     = "0.1.0"
description = "SO-101 robot manipulation: teleoperation & Isaac Sim training"
readme      = "README.md"

# Python 3.11 고정 (Isaac Sim 5.1.0 및 LeRobot 0.4.2 공식 지원 버전)
requires-python = ">=3.11,<3.13"

# ── 공통 의존성 ─────────────────────────────────────────────────────────────
# 모든 그룹(teleop / isaac)에서 공유되는 최소 패키지만 여기에 선언.
# 환경별 heavy 패키지(torch, isaacsim 등)는 아래 dependency-groups 에 배치.
dependencies = [
    # HDF5 파일 I/O (에피소드 녹화 데이터 저장)
    "h5py<3.16",
    # HuggingFace Hub XET 전송 가속 (대용량 데이터셋 push/pull 최적화)
    "hf-xet>=1.4.3",
    # ZMQ 소켓 (IsaacLab ↔ LeRobot 프로세스 간 통신)
    "pyzmq>=27.1.0",
    # LeRobot >= 0.4.2 + feetech extra
    #   feetech extra 포함 내용: feetech-servo-sdk, pyserial, opencv-python,
    #   huggingface-hub, datasets, draccus, gym, safetensors 등
    # policy / async 의존성은 Dockerfile.policy 가 dependency-groups
    # (policy, async) 로 별도 설치 → teleop 이미지는 가볍게 유지
    "lerobot[feetech]>=0.4.4",
    # PyTorch — CUDA 12.8 빌드 (pytorch-cu128 index 에서 설치, 아래 sources 참조)
    "torch>=2.7",
    "torchvision>=0.22",
    # USD Python API (scripts/author_pick_pen_scene.py 가 .usda→.usdc 변환에 사용).
    # 순수 Python 패키지라 isaac 그룹 없이도 씬 author/검증이 가능하도록 공용에 배치.
    "usd-core>=26.5",
]


# =============================================================================
# ■ 의존성 그룹
# =============================================================================
[dependency-groups]

# ── teleop: 실물 Arm Teleoperation ──────────────────────────────────────────
# SO-101 Leader/Follower Arm을 직렬 포트로 연결해 원격 조작하는 환경.
# Feetech STS3215 서보 통신을 위해 lerobot[feetech] extra 사용.
# Docker 이미지(docker/Dockerfile.lerobot)는 async 와 함께 설치: --group teleop --group async
teleop = [
    "ffmpeg>=1.4",
    # evdev: Linux 전용 입력 장치 라이브러리 (gamepad / joystick 텔레op 지원)
    # Windows에서는 설치 불가 → sys_platform 마커로 lockfile 생성 실패 방지
    "evdev>=1.7; sys_platform == 'linux'",
    "packaging>=25.0",
]

# ── policy: VLA policy 추론/학습 보조 의존성 ────────────────────────────
# ※ 실제 설치는 Dockerfile.policy 의 uv pip install 로 수행한다.
#   pyproject.toml 의 override-dependencies (numpy==1.26.0 등) 가 lerobot 0.5.1
#   (numpy>=2.0) 과 충돌하므로 Docker 에서는 uv sync 를 사용하지 않는다.
#   본 그룹은 호스트에서 uv sync --group policy 를 실행할 경우를 위한 참조용.
#
# GR00T-N1.5 3B 지원 패키지 (lerobot[groot] extra 내용을 풀어서 명시):
#   peft / diffusers / dm-tree / timm / decord / ninja / flash-attn
#   flash-attn 은 uv 가 소스 빌드하며 no-build-isolation 이 필요 →
#   아래 [tool.uv] no-build-isolation-package 에 선언. 빌드 시 NVCC 필요 →
#   Dockerfile.policy 의 base 스테이지가 devel 이미지를 사용한다.
policy = [
    # Docker(Python 3.12)에서는 lerobot 0.5.1이 실제로 설치되지만,
    # 호스트(Python 3.11)에서 uv resolve 충돌을 피하기 위해 하한만 명시.
    # (Dockerfile.policy는 uv sync를 쓰지 않으므로 이 값이 Docker 빌드에 영향 없음)
    "lerobot[smolvla]>=0.4.2",
    "num2words>=0.5.14,<0.6.0",
    "accelerate>=1.7.0,<2.0.0",
    "safetensors>=0.4.3,<1.0.0",
    # ── GR00T-N1.5 의존성 ────────────────────────────────────────────────
    # lerobot[groot] extra 를 풀어쓴 것과 동일한 패키지 셋.
    # peft: LoRA / AdaLoRA 어댑터 (GR00T fine-tune)
    "peft>=0.18.0,<1.0.0",
    # diffusers: 확산 모델 유틸리티 (GR00T 디노이징 헤드)
    "diffusers>=0.27.2,<0.36.0",
    # dm-tree: 중첩 구조 순회 (GR00T 관측 전처리)
    "dm-tree>=0.1.8,<1.0.0",
    # timm: 비전 백본 (GR00T 이미지 인코더)
    "timm>=1.0.0,<1.1.0",
    # decord: 고속 비디오 디코더 (데이터로더). x86_64 Linux 전용 빌드만 존재.
    "decord>=0.6.0,<1.0.0; platform_machine == 'x86_64'",
    # ninja: C++ 확장 빌드 가속 (flash-attn 컴파일 속도 향상)
    "ninja>=1.11.1,<2.0.0",
    # flash-attn: GR00T-N1.5 필수. SmolVLA 는 eager attention 하드코딩으로 미사용.
    # macOS 는 CUDA 미지원이므로 제외. 소스 빌드 필요 → no-build-isolation-package 선언.
    "flash-attn>=2.5.9,<3.0.0; sys_platform != 'darwin'",
]

# ── async: Async inference policy server (gRPC) ──────────────────────────────
# lerobot.async_inference.policy_server / robot_client 가 의존하는 gRPC 스택.
# 정책 서버 이미지에서만 설치된다.
async = [
    "grpcio==1.73.1",
    "protobuf>=6.31.1,<6.32.0",
]

# ── isaac: Isaac Sim / IsaacLab 시뮬레이션 환경 ─────────────────────────────
# NVIDIA Isaac Sim 5.1.0 기반의 강화학습 및 데이터 수집 환경.
# leisaac 를 통해 IsaacLab / LeRobot / GR00T 브릿지 제공.
# 용량이 매우 크므로(~20 GB) 별도 Docker 이미지 또는 로컬 환경에서 사용.
isaac = [
    # Isaac Sim 5.1.0 전체 확장 패키지 (nvidia pypi index 에서 설치)
    "isaacsim[all,extscache]==5.1.0",
    # LightwheelAI leisaac: IsaacLab + LeRobot + GR00T 통합 래퍼
    "leisaac[isaaclab,gr00t]",
]

# ── dev: 개발 도구 ───────────────────────────────────────────────────────────
# Jupyter 노트북, 프로파일링 등 개발 전용 도구.
# 프로덕션 Docker 이미지에는 포함하지 않음.
dev = [
    "ipykernel>=7.2.0",
]


# =============================================================================
# ■ 패키지 소스 인덱스 (uv 전용)
# =============================================================================

[tool.uv.sources]
# torch / torchvision → PyTorch 공식 CUDA 12.8 인덱스에서 설치
# (teleop 그룹과 isaac 그룹 모두 여기서 해석)
torch       = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
# isaacsim → NVIDIA 전용 PyPI
isaacsim    = [{ index = "nvidia" }]
# leisaac → GitHub 소스 (v0.4.0 태그 고정)
leisaac = [{ git = "https://github.com/LightwheelAI/leisaac", subdirectory = "source/leisaac", tag = "v0.4.0" }]

[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true   # 이 index는 명시된 패키지(torch/torchvision)에만 적용

[[tool.uv.index]]
name     = "nvidia"
url      = "https://pypi.nvidia.com"
# explicit 미설정 → isaacsim 외 다른 패키지도 fallback으로 탐색 가능


# =============================================================================
# ■ uv 전역 설정
# =============================================================================
[tool.uv]

# flash-attn 은 빌드 시 torch 가 이미 설치된 환경이 필요 (no-build-isolation).
# uv 는 이 목록의 패키지를 --no-build-isolation 으로 빌드한다.
# Dockerfile.policy 에서 torch 설치(torch-layer) 이후 uv sync 를 실행하므로
# torch 헤더를 참조하는 flash-attn 빌드가 정상 동작한다.
no-build-isolation-package = ["flash-attn"]

# 버전 충돌 방지를 위한 전역 오버라이드
override-dependencies = [
    # HuggingFace 생태계 호환성 (datasets, transformers 등)
    "packaging>=24.2,<26.0",
    # Isaac Sim 5.1.0 공식 지원 numpy 버전
    "numpy==1.26.0",
    # pyarrow<19: numpy 1.x C-API 호환 상한 (PyArrow 19+는 numpy 2.x ABI 전용)
    "pyarrow>=17,<19",
    # datasets 4.7.0+에서 pa.json_() 사용 (PyArrow 19 이상 필요) → pyarrow<19와 충돌 방지
    "datasets>=4.0.0,<4.7.0",
    # torchcodec 0.5.x 가 PyTorch 2.7 호환 (torch==2.7.0+cu128 핀과 매칭).
    # unpinned 으로 두면 최신 (0.10+) 이 설치되어 PyTorch 2.11+ ABI 로 빌드된
    # libtorchcodec_core*.so 가 c10 cxx11 심볼 (c10::MessageLogger::stream) 을
    # 찾지 못해 lerobot-dataset-viz / decode_video_frames_torchcodec 가 죽는다.
    # win32 제외: torchcodec 0.5 는 Windows 휠이 없고, lerobot 도 win32 에선
    # torchcodec 을 요구하지 않는다 (METADATA 마커). 호스트(Windows) uv resolve
    # 통과를 위해 override 도 동일하게 win32 를 뺀다 — 추론 클라는 torchcodec 미사용.
    "torchcodec>=0.5,<0.6; sys_platform != 'win32'",
]
# 빌드 백엔드(setuptools) 버전 고정: setuptools 82+ 에서 발생하는 빌드 오류 회피
build-constraint-dependencies = [
    "setuptools<82",
]
