[project]
name = "so101-real-lerobot"
version = "0.1.0"
description = "Windows native SO-101 control and LeRobot v0.6 async client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[async,core_scripts,feetech]==0.6.0",
    "ffmpeg>=1.4",
    "hf-xet>=1.4.3",
    "numpy>=2.0.0,<2.3.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
